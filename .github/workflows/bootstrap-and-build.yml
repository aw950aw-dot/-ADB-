name: Build release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: release-apk-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Decode release signing key
        if: ${{ secrets.ADB_SMART_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ADB_SMART_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/adb-smart-release.jks"
      - name: Run unit tests and Android lint
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest lintRelease --stacktrace
      - name: Build release APK
        env:
          ADB_SMART_KEYSTORE_PATH: ${{ runner.temp }}/adb-smart-release.jks
          ADB_SMART_STORE_PASSWORD: ${{ secrets.ADB_SMART_STORE_PASSWORD }}
          ADB_SMART_KEY_ALIAS: ${{ secrets.ADB_SMART_KEY_ALIAS }}
          ADB_SMART_KEY_PASSWORD: ${{ secrets.ADB_SMART_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ladb-hebrew-ai-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

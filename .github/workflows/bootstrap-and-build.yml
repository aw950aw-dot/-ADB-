name: Build release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app overlay
        uses: actions/checkout@v4
      - name: Import LADB engine source
        run: |
          git clone --depth 1 https://github.com/tytydraco/LADB.git /tmp/ladb
          rsync -a --exclude='.git' /tmp/ladb/ ./
          cp -a .overlay/. ./
          rm -rf .overlay
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ladb-hebrew-ai-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

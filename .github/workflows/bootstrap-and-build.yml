name: Build release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: release-apk-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: adb-smart-debug-keystore-v2
      - name: Create stable debug signing key when missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ADB_SMART_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/adb-smart-release.jks"
            echo "ADB_SMART_KEYSTORE_PATH=$RUNNER_TEMP/adb-smart-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          ADB_SMART_STORE_PASSWORD: ${{ secrets.ADB_SMART_STORE_PASSWORD }}
          ADB_SMART_KEY_ALIAS: ${{ secrets.ADB_SMART_KEY_ALIAS }}
          ADB_SMART_KEY_PASSWORD: ${{ secrets.ADB_SMART_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Verify APK alignment, signature and Android metadata
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -s "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$APK")
          printf '%s\\n' "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\\n' "$BADGING" | head -n 10
          echo "$BADGING" | grep -q "package: name='com.aw950aw.adbsmart' versionCode='16' versionName='1.9.6'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'33'"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adb-smart-1.9.6-installable
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Run unit tests and Android lint (after publishing APK)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest lintRelease --stacktrace
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK on Android 13 emulator
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.aw950aw.adbsmart

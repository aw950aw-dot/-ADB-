plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The direct wireless-ADB library is optional: -PwithLibAdb=false builds a version without it
// (Shizuku / Root only). The CI workflow uses that as an automatic fallback.
def withLibAdb = (project.findProperty('withLibAdb') ?: 'true') != 'false'
// libadb-android is published on JitPack; the CI tries several coordinates (-PlibAdbCoordinate=...).
def libAdbCoordinate = project.findProperty('libAdbCoordinate') ?: 'com.github.MuntashirAkon:libadb-android:master-SNAPSHOT'

android {
    namespace 'com.aw950aw.smartbackup'
    compileSdk 36

    defaultConfig {
        applicationId "com.aw950aw.smartbackup"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // A fixed key that lives in the repository, so every build is signed the same way and a new
    // APK can always be installed over the previous one (no more "signature mismatch").
    signingConfigs {
        release {
            storeFile file('smartbackup.jks')
            storePassword 'smartbackup'
            keyAlias 'smartbackup'
            keyPassword 'smartbackup'
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        aidl true
    }

    sourceSets {
        main {
            if (withLibAdb) {
                java.srcDir 'src/libadb/java'
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'

    implementation platform('androidx.compose:compose-bom:2025.05.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    if (withLibAdb) {
        // Pure-Java wireless ADB client: pairing with the code and the TLS connection.
        implementation libAdbCoordinate
        implementation 'org.conscrypt:conscrypt-android:2.5.3'
    }

    // Official Shizuku API (privileged shell without root).
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}

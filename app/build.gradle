plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.android.gms.oss-licenses-plugin'
}

def releaseStorePath = System.getenv("ADB_SMART_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ADB_SMART_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("ADB_SMART_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ADB_SMART_KEY_PASSWORD")
def hasAnyReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .any { it != null && !it.isEmpty() }
def hasCompleteReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.isEmpty() }
if (hasAnyReleaseSigning && !hasCompleteReleaseSigning) {
    throw new GradleException("ADB SMART release signing is incomplete. Configure all four ADB_SMART_* signing values.")
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.aw950aw.adbsmart"
        minSdk 26
        targetSdk 33
        versionCode 16
        versionName "1.9.6"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
        }
        release {
            enableV1Signing = true
            enableV2Signing = true
            if (hasCompleteReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasCompleteReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField 'Boolean', 'ANTI_PIRACY', RELEASE_ANTIPIRACY
        }

        debug {
            buildConfigField 'Boolean', 'ANTI_PIRACY', DEBUG_ANTIPIRACY
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }
    namespace 'com.draco.ladb'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'


    implementation("androidx.activity:activity-ktx:1.10.1")

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.gms:play-services-oss-licenses:17.1.0'

    // Official Shizuku API: request user-approved shell access through a UserService.
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
